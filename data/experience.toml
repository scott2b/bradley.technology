# The editorial layer of /experience/ — what is current, and the chapters the
# previous roles are read in.
#
# Roles, dates, and descriptions come from content/experience/; project titles
# and descriptions from content/projects/. Only what those pages cannot say for
# themselves lives here.

# Roles still running, in display order. Deliberately not read off the pages,
# so that a page's dates and the editorial judgement of what is current stay
# separate things. See STATUS.md in the vault project (~/vault/projects/BradleyTechnology).
current_roles = ["knightlab", "socialcontext", "coursera"]

# Current projects, in display order. The weight order on content/projects/ is
# that section's own editorial ranking and says nothing about what is running.
# A slug with no page under content/projects/ is simply not drawn.
current_projects = ["newscompass", "overstory", "socialcontext-open", "sensorgrid"]

current_reading = "Knight Lab since 2012, socialcontext.ai since 2020, and course design for Coursera."

