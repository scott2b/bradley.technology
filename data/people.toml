# People named on the site. Each entry feeds the `person` shortcode
# ({{ person(id="argamon") }}) and the publication author lists: the name
# becomes a link to the profile, opened in a new tab, with the bio in a
# hover card.
#
# name:    as it should appear in the card (the page may show a shorter form).
# bio:     one or two sentences in our words, from the person's public profile.
#          Present tense only where the role is current as of `checked`.
# url:     LinkedIn where they have one, else their professional home page.
# link:    the label shown at the foot of the card for where the link goes.
# checked: the date the url and bio were last looked at.
# photo_source: where static/images/people/<id>.jpg was taken from, if there is one.

